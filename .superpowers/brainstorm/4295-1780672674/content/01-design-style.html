
<h2>设计风格选择</h2>
<p class="subtitle">我们要做一个"简洁美观大气上档次"的图床。请选择你喜欢的风格方向：</p>

<div class="cards">
  <div class="card" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); padding: 40px; text-align: center;">
      <div style="border: 2px solid #e0e0e0; border-radius: 12px; background: white; padding: 40px; max-width: 200px; margin: 0 auto;">
        <div style="width: 80px; height: 80px; background: #f0f0f0; border-radius: 8px; margin: 0 auto 16px;"></div>
        <div style="height: 8px; background: #e0e0e0; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="height: 8px; background: #e0e0e0; border-radius: 4px; width: 60%; margin: 0 auto;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>极简主义</h3>
      <p>纯白背景，少量灰色，重点突出内容，适合图床这种工具类应用</p>
    </div>
  </div>
  <div class="card" data-choice="modern" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; text-align: center;">
      <div style="border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; background: rgba(255,255,255,0.95); padding: 40px; max-width: 200px; margin: 0 auto;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 8px; margin: 0 auto 16px;"></div>
        <div style="height: 8px; background: #e0e0e0; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="height: 8px; background: #e0e0e0; border-radius: 4px; width: 60%; margin: 0 auto;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>现代渐变</h3>
      <p>使用精美的渐变色和玻璃拟态效果，视觉效果更丰富</p>
    </div>
  </div>
  <div class="card" data-choice="dark" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 40px; text-align: center;">
      <div style="border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(30,30,50,0.95); padding: 40px; max-width: 200px; margin: 0 auto;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #0f3460, #1a1a2e); border-radius: 8px; margin: 0 auto 16px;"></div>
        <div style="height: 8px; background: #333; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="height: 8px; background: #333; border-radius: 4px; width: 60%; margin: 0 auto;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>深色模式</h3>
      <p>专业的深色主题，适合长时间使用，护眼且显得很高级</p>
    </div>
  </div>
</div>
